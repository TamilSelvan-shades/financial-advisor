databases:
  - name: ai-advisor-db
    databaseName: advisor_db
    user: advisor_user
    plan: free # Update as needed based on your Render plan

services:
  - type: web
    name: ai-advisor-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-advisor-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
